name: Release (CD)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Nomor versi SemVer (contoh: 1.0.0 atau v1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version & Tag
        id: version_step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_VER="${{ github.event.inputs.version }}"
            if [[ "$INPUT_VER" =~ ^v ]]; then
              TAG_NAME="$INPUT_VER"
            else
              TAG_NAME="v$INPUT_VER"
            fi
            echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "RELEASE_TITLE=bas $TAG_NAME" >> $GITHUB_OUTPUT
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME" || true
            git push origin "$TAG_NAME" || true
          else
            TAG_NAME="${{ github.ref_name }}"
            echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "RELEASE_TITLE=bas $TAG_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release Asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/bas-${{ steps.version_step.outputs.TAG_NAME }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.TAG_NAME }}
          name: ${{ steps.version_step.outputs.RELEASE_TITLE }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/bas-${{ steps.version_step.outputs.TAG_NAME }}.apk
